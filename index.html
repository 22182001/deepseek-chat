<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 800px;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        /* 头部 */
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 20px 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

        /* API 设置区 */
        .settings {
            padding: 12px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .settings .row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .settings input[type="password"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            font-family: monospace;
            background: white;
        }
        .settings input:focus { outline: none; border-color: #4f46e5; }
        .settings .btn-save {
            padding: 10px 18px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        .settings .status {
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
        .settings .status.ok { color: #22c55e; }
        .settings .status.err { color: #ef4444; }

        /* 聊天消息区域 */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
        }
        .msg {
            display: flex;
            margin-bottom: 14px;
        }
        .msg.user { justify-content: flex-end; }
        .msg.assistant { justify-content: flex-start; }
        .msg .bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .msg.user .bubble {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant .bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .msg.error { justify-content: center; }
        .msg.error .bubble {
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
        }

        /* 加载动画（三个点） */
        .typing .bubble {
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            padding: 12px 18px !important;
        }
        .typing .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing .dot:nth-child(1) { animation-delay: -0.32s; }
        .typing .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 底部输入区 */
        .input-area {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            background: #f1f5f9;
        }
        .input-area input:focus { border-color: #4f46e5; background: white; }
        .input-area button {
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-area .clear-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- 头部 -->
    <div class="header">
        <h1>🤖 DeepSeek</h1>
        <p>智能对话助手</p>
    </div>

    <!-- API 设置 -->
    <div class="settings">
        <div class="row">
            <input type="password" id="apiKey" placeholder="输入你的 API Key">
            <button class="btn-save" onclick="saveKey()">保存</button>
        </div>
        <div id="status" class="status">⚠️ 请设置 API Key</div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat" id="chatArea">
        <div class="msg assistant">
            <div class="bubble">你好！我是 DeepSeek 助手。请先在上方输入你的 API Key 开始对话 💬</div>
        </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">发送</button>
    </div>
</div>

<script>
    let messages = [];
    let loading = false;

    // 加载保存的 API Key
    (function load() {
        const key = localStorage.getItem('deepseek_api_key');
        if (key) {
            document.getElementById('apiKey').value = key;
            setStatus(true);
        }
    })();

    function setStatus(ok) {
        const el = document.getElementById('status');
        if (ok) {
            el.textContent = '✅ API Key 已配置';
            el.className = 'status ok';
        } else {
            el.textContent = '⚠️ 请设置 API Key';
            el.className = 'status err';
        }
    }

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('deepseek_api_key', key);
            setStatus(true);
            alert('✅ API Key 已保存到本地');
        } else {
            alert('请输入 API Key');
        }
    }

    function addMessage(role, content, isError = false) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        if (isError) div.className = 'msg error';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'assistant' && !isError) {
            bubble.innerHTML = content.replace(/\n/g, '<br>');
        } else {
            bubble.textContent = content;
        }
        div.appendChild(bubble);
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        if (!isError && role !== 'error') {
            messages.push({ role, content });
        }
    }

    function showTyping() {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg assistant typing';
        div.id = 'typingIndicator';
        div.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function callDeepSeek(userMessage) {
        const apiKey = localStorage.getItem('deepseek_api_key');
        if (!apiKey) throw new Error('请先设置 API Key');

        const requestMessages = [
            { role: 'system', content: '你是一个乐于助人的 AI 助手。' },
            ...messages
        ];

        const resp = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: requestMessages,
                stream: false,
                temperature: 0.7,
                max_tokens: 2000
            })
        });

        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.error?.message || `请求失败 (${resp.status})`);
        }

        const data = await resp.json();
        return data.choices[0].message.content;
    }

    async function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text || loading) return;

        const apiKey = localStorage.getItem('deepseek_api_key');
        if (!apiKey) {
            alert('请先在上方设置 API Key');
            return;
        }

        input.value = '';
        addMessage('user', text);

        loading = true;
        document.getElementById('sendBtn').disabled = true;
        showTyping();

        try {
            const reply = await callDeepSeek(text);
            hideTyping();
            addMessage('assistant', reply);
        } catch (e) {
            hideTyping();
            addMessage('error', '❌ ' + e.message, true);
        } finally {
            loading = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
    }
</script>
</body>
</html>
