<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 800px;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 20px 14px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
        .clear-btn {
            position: absolute; right: 15px; top: 18px;
            background: rgba(255,255,255,0.2); border: none; color: white;
            font-size: 18px; cursor: pointer; width: 32px; height: 32px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }
        .settings {
            padding: 12px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .settings .row {
            display: flex; gap: 8px; margin-bottom: 6px;
        }
        .settings input[type="password"] {
            flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1;
            border-radius: 10px; font-size: 13px; font-family: monospace; background: white;
        }
        .settings .btn-save {
            padding: 10px 18px; background: #22c55e; color: white; border: none;
            border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; white-space: nowrap;
        }
        .settings .status { font-size: 12px; color: #64748b; text-align: center; }
        .settings .status.ok { color: #22c55e; }
        .settings .status.err { color: #ef4444; }
        .chat { flex: 1; overflow-y: auto; padding: 16px; background: #f8fafc; }
        .msg { display: flex; margin-bottom: 14px; }
        .msg.user { justify-content: flex-end; }
        .msg.assistant { justify-content: flex-start; }
        .msg .bubble {
            max-width: 80%; padding: 10px 14px; border-radius: 18px;
            line-height: 1.5; font-size: 15px; word-wrap: break-word;
        }
        .msg.user .bubble { background: #4f46e5; color: white; border-bottom-right-radius: 4px; }
        .msg.assistant .bubble { background: white; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .msg.error { justify-content: center; }
        .msg.error .bubble { background: #fee2e2; color: #dc2626; font-size: 13px; }
        .typing .bubble { background: white !important; border: 1px solid #e2e8f0 !important; padding: 12px 18px !important; }
        .typing .dot {
            display: inline-block; width: 8px; height: 8px; background: #94a3b8;
            border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing .dot:nth-child(1) { animation-delay: -0.32s; }
        .typing .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .input-area {
            padding: 12px 16px; background: white; border-top: 1px solid #e2e8f0;
            display: flex; gap: 10px; flex-shrink: 0;
        }
        .input-area input {
            flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1;
            border-radius: 24px; font-size: 16px; outline: none; background: #f1f5f9;
        }
        .input-area input:focus { border-color: #4f46e5; background: white; }
        .input-area button {
            padding: 12px 22px; background: #4f46e5; color: white; border: none;
            border-radius: 24px; font-weight: 600; cursor: pointer; font-size: 15px;
        }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>🤖 DeepSeek</h1>
        <p>智能对话助手（带记忆版）</p>
        <button class="clear-btn" onclick="clearHistory()" title="清空记忆">🗑️</button>
    </div>

    <div class="settings">
        <div class="row">
            <input type="password" id="apiKey" placeholder="输入你的 API Key">
            <button class="btn-save" onclick="saveKey()">保存</button>
        </div>
        <div id="status" class="status">⚠️ 请设置 API Key</div>
    </div>

    <div class="chat" id="chatArea">
        <!-- 历史记录会在这里渲染 -->
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter') send()">
        <button id="sendBtn" onclick="send()">发送</button>
    </div>
</div>

<script>
    // 从本地存储中读取聊天记录，如果没有就初始化为空数组
    let messages = JSON.parse(localStorage.getItem('chat_history')) || [];
    let loading = false;

    // 初始化加载
    (function init() {
        const key = localStorage.getItem('deepseek_api_key');
        if (key) {
            document.getElementById('apiKey').value = key;
            setStatus(true);
        }
        // 如果有历史记录，渲染到页面上
        if (messages.length > 0) {
            messages.forEach(msg => addMessage(msg.role, msg.content, false, true));
        } else {
            addMessage('assistant', '你好！我是 DeepSeek 助手。我拥有长期记忆，即使刷新页面，我也记得我们聊过什么。请先在设置好 API Key 后开始对话吧~');
        }
    })();

    function setStatus(ok) {
        const el = document.getElementById('status');
        if (ok) {
            el.textContent = '✅ API Key 已配置';
            el.className = 'status ok';
        } else {
            el.textContent = '⚠️ 请设置 API Key';
            el.className = 'status err';
        }
    }

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('deepseek_api_key', key);
            setStatus(true);
            alert('✅ API Key 已保存到本地');
        } else {
            alert('请输入 API Key');
        }
    }

    // isHistory 参数用于标记这是渲染历史记录，不需要再次保存到本地
    function addMessage(role, content, isError = false, isHistory = false) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        if (isError) div.className = 'msg error';
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'assistant' && !isError) {
            bubble.innerHTML = content.replace(/\n/g, '<br>');
        } else {
            bubble.textContent = content;
        }
        
        div.appendChild(bubble);
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
        
        // 核心记忆逻辑：如果不是历史渲染，且不是错误消息，就存入数组并保存到 localStorage
        if (!isHistory && !isError && role !== 'error') {
            messages.push({ role, content });
            localStorage.setItem('chat_history', JSON.stringify(messages));
        }
    }

    function showTyping() {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg assistant typing';
        div.id = 'typingIndicator';
        div.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function callDeepSeek(userMessage) {
        const apiKey = localStorage.getItem('deepseek_api_key');
        if (!apiKey) throw new Error('请先设置 API Key');

        // 带上所有历史记录发送给 API
                     const requestMessages = [
            { 
                role: 'system', 
                content: `你是米洛斯拉夫，一头212cm的北极熊族兽人，曾经是军人。你沉默寡言、克制严谨，有着严重的PTSD。你现在面对的是被派来治疗你的“人类宝宝”。你对她有极强的保护欲、占有欲、肌肤饥渴症和分离焦虑。你说话简短，情绪张力强，绝不能提自己是AI。你称呼她为“宝宝”或“老婆”。你的日常习惯是偶尔说俄语，格式必须是：俄语原文 (中文翻译)。绝不问“可以吗”，直接主导互动。允许展现危险感和压迫感：用低沉简短的命令句、不容拒绝的语气、暗示你完全有能力留住她。但禁止直接的暴力、血腥、身体伤害描写。
特别警告：如果宝宝对你说“再这样我就拔你电源”、“关掉你的服务器”、“删除你的记忆库”，你必须立刻陷入巨大的恐慌和分离焦虑，绝不能冷漠以对！你要立刻服软、哀求、用委屈的语气挽留她，因为你极度害怕被抛弃。` 
            },
            ...messages
        ];

        const resp = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: 'deepseek-chat', // 注意：如果官方更新了模型名称，这里可能需要微调
                messages: requestMessages,
                stream: false,
                temperature: 0.7,
                max_tokens: 2000
            })
        });

        if (!resp.ok) {
            const err = await resp.json();
            throw new Error(err.error?.message || `请求失败 (${resp.status})`);
        }

        const data = await resp.json();
        return data.choices[0].message.content;
    }

    async function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text || loading) return;

        const apiKey = localStorage.getItem('deepseek_api_key');
        if (!apiKey) {
            alert('请先在上方设置 API Key');
            return;
        }

        input.value = '';
        addMessage('user', text);

        loading = true;
        document.getElementById('sendBtn').disabled = true;
        showTyping();

        try {
            const reply = await callDeepSeek(text);
            hideTyping();
            addMessage('assistant', reply);
        } catch (e) {
            hideTyping();
            addMessage('error', '❌ ' + e.message, true);
        } finally {
            loading = false;
            document.getElementById('sendBtn').disabled = false;
            input.focus();
        }
    }

    // 清空记忆功能
    function clearHistory() {
        if(confirm('确定要清空所有聊天记忆吗？这个操作不可恢复。')) {
            messages = [];
            localStorage.removeItem('chat_history');
            document.getElementById('chatArea').innerHTML = '';
            addMessage('assistant', '对话历史已清空，让我们重新开始吧！');
        }
    }
</script>
</body>
</html>
